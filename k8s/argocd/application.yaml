apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: projetmern
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/azizlejmi12/to-do
    targetRevision: dev
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true 
